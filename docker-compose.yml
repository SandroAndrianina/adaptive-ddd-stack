services:
  db:
    image: mysql:8
    container_name: adaptive-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${HOST_MYSQL_PORT}:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  java-service:
    build: ./java-service
    container_name: adaptive-java
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PHP_BASE_URL: ${PHP_BASE_URL}
    ports:
      - "${HOST_JAVA_PORT}:8080"
    volumes:
      - ./config:/etc/adaptive:ro

  php-app:
    build: ./php-app
    container_name: adaptive-php
    depends_on:
      - java-service
    environment:
      JAVA_BASE_URL: ${JAVA_BASE_URL}
    ports:
      - "${HOST_PHP_PORT}:80"
    volumes:
      - ./config:/etc/adaptive:ro